name: Install exact CV

on:
  push:
    paths:
      - 'cv_patch.json'
      - '.github/workflows/cv-exact.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace CV with exact uploaded PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json

          old = Path('cv.pdf').read_bytes()
          assert hashlib.sha256(old).hexdigest() == '2e786a6e067d52a408b224e5ff8b6595b2c6e429ef8035d04f3366022542c417'
          ops = json.loads(Path('cv_patch.json').read_text())
          out = bytearray()
          pos = 0
          for i1, i2, payload in ops:
              out += old[pos:i1]
              out += base64.b64decode(payload)
              pos = i2
          out += old[pos:]
          out = bytes(out)
          assert hashlib.sha256(out).hexdigest() == 'f3816ed6b6f586a9e6c30d5c8441619198b226a3556345dcaeb10b81c34a9f8e'
          Path('cv.pdf').write_bytes(out)
          PY
      - name: Commit exact PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm cv_patch.json .github/workflows/cv-exact.yml
          git add cv.pdf
          git commit -m "Replace CV with exact uploaded PDF"
          git push
