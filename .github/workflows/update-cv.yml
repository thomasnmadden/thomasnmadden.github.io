name: Restore Original CV

on:
  push:
    paths:
      - '.github/workflows/update-cv.yml'

permissions:
  contents: write

jobs:
  restore-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact uploaded PDF
        run: |
          cat cv_original_chunks/part* | base64 -d > cv.pdf
          echo "2e786a6e067d52a408b224e5ff8b6595b2c6e429ef8035d04f3366022542c417  cv.pdf" | sha256sum -c -
      - name: Commit exact CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git commit -m "Use exact uploaded CV PDF" || exit 0
          git push
