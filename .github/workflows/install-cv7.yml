name: Install CV7 exactly

on:
  push:
    branches:
      - cv7-stage
    paths:
      - 'cv7_patch.json'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact PDF
        run: |
          echo "f3816ed6b6f586a9e6c30d5c8441619198b226a3556345dcaeb10b81c34a9f8e  cv.pdf" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import json, base64
          old = Path('cv.pdf').read_bytes()
          ops = json.loads(Path('cv7_patch.json').read_text())
          out = bytearray()
          for op in ops:
              if op[0] == 'c':
                  out += old[op[1]:op[2]]
              else:
                  out += base64.b64decode(op[1])
          Path('cv.pdf').write_bytes(out)
          PY
          echo "4295e8570130259ff943a897af2662fcfb90bb5e46018282b13d7692c664ae44  cv.pdf" | sha256sum -c -
      - name: Commit exact PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf cv7_chunks cv7_patch.json .github/workflows/install-cv7.yml
          git add cv.pdf
          git commit -m "Replace CV with exact uploaded PDF"
          git push
